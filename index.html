<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#fdfdfc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Não Esquecer">
<title>Não Esquecer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;

    --bg:    #fdfdfc;
    --surface: #ffffff;
    --surface-2: rgba(255, 255, 255, 0.55);

    --ink:   #0a0a0a;
    --ink-2: #525252;
    --ink-3: #a3a3a3;
    --ink-4: #d4d4d4;

    --copper:       #b45309;
    --copper-2:     #92400e;
    --copper-light: #f59e0b;
    --copper-soft:  rgba(180, 83, 9, 0.09);

    --forest:   #4a5240;
    --forest-2: #3f4a2e;
    --forest-soft: rgba(74, 82, 64, 0.12);

    --danger: #b91c1c;
    --danger-bg: rgba(185, 28, 28, 0.09);

    --card:        rgba(255, 255, 255, 0.88);
    --card-border: rgba(0, 0, 0, 0.06);
    --card-border-strong: rgba(0, 0, 0, 0.10);

    --track: rgba(0, 0, 0, 0.06);
    --seg:   rgba(0, 0, 0, 0.045);
    --hover: rgba(0, 0, 0, 0.05);
    --inset-hi: rgba(255, 255, 255, 0.95);
    --empty-bg: rgba(255, 255, 255, 0.5);
    --pin-bg: linear-gradient(180deg, rgba(255, 253, 250, 0.92), rgba(255, 251, 244, 0.85));

    --glow-a: rgba(251, 191, 36, 0.09);
    --glow-b: rgba(74, 82, 64, 0.05);
    --glow-c: rgba(180, 83, 9, 0.04);

    --t0: #fffaf3;
    --t1: #f6f7f1;
    --t2: #fffdf0;
    --t3: #fff5f0;
    --t4: #faf4f1;

    --shadow-item:
      0 1px 2px rgba(0, 0, 0, 0.02),
      0 4px 12px -4px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 var(--inset-hi);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #141210;
    --surface: #25221e;
    --surface-2: rgba(255, 255, 255, 0.04);
    --ink: #f4f1ec;
    --ink-2: #b9b3aa;
    --ink-3: #7f7a72;
    --ink-4: #4d4943;
    --copper: #d9822b;
    --copper-2: #c2701f;
    --copper-light: #f5b04a;
    --copper-soft: rgba(217, 130, 43, 0.16);
    --forest: #6b7a58;
    --forest-2: #5b6a49;
    --forest-soft: rgba(107, 122, 88, 0.2);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.14);
    --card: rgba(38, 35, 31, 0.88);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-border-strong: rgba(255, 255, 255, 0.15);
    --track: rgba(255, 255, 255, 0.09);
    --seg: rgba(255, 255, 255, 0.07);
    --hover: rgba(255, 255, 255, 0.08);
    --inset-hi: rgba(255, 255, 255, 0.05);
    --empty-bg: rgba(255, 255, 255, 0.03);
    --pin-bg: linear-gradient(180deg, rgba(58, 46, 34, 0.9), rgba(48, 39, 30, 0.85));
    --glow-a: rgba(251, 191, 36, 0.06);
    --glow-b: rgba(107, 122, 88, 0.07);
    --glow-c: rgba(217, 130, 43, 0.05);
    --t0: #2b2520;
    --t1: #262a21;
    --t2: #2c2a1a;
    --t3: #2d231f;
    --t4: #2a2321;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #141210;
      --surface: #25221e;
      --surface-2: rgba(255, 255, 255, 0.04);
      --ink: #f4f1ec;
      --ink-2: #b9b3aa;
      --ink-3: #7f7a72;
      --ink-4: #4d4943;
      --copper: #d9822b;
      --copper-2: #c2701f;
      --copper-light: #f5b04a;
      --copper-soft: rgba(217, 130, 43, 0.16);
      --forest: #6b7a58;
      --forest-2: #5b6a49;
      --forest-soft: rgba(107, 122, 88, 0.2);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --card: rgba(38, 35, 31, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-strong: rgba(255, 255, 255, 0.15);
      --track: rgba(255, 255, 255, 0.09);
      --seg: rgba(255, 255, 255, 0.07);
      --hover: rgba(255, 255, 255, 0.08);
      --inset-hi: rgba(255, 255, 255, 0.05);
      --empty-bg: rgba(255, 255, 255, 0.03);
      --pin-bg: linear-gradient(180deg, rgba(58, 46, 34, 0.9), rgba(48, 39, 30, 0.85));
      --glow-a: rgba(251, 191, 36, 0.06);
      --glow-b: rgba(107, 122, 88, 0.07);
      --glow-c: rgba(217, 130, 43, 0.05);
      --t0: #2b2520;
      --t1: #262a21;
      --t2: #2c2a1a;
      --t3: #2d231f;
      --t4: #2a2321;
    }
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }

  body{
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.011em;
    color: var(--ink);
    overflow: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -5%, var(--glow-a), transparent 65%),
      radial-gradient(ellipse 70% 45% at 50% 105%, var(--glow-b), transparent 65%),
      radial-gradient(ellipse 40% 30% at 15% 40%, var(--glow-c), transparent 70%);
    background-attachment: fixed;
    transition: background-color .3s;
  }

  .app{
    position: relative;
    z-index: 1;
    width: min(100vw, 400px);
    height: min(100dvh, 860px);
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ═══════════════ topo ═══════════════ */
  .top{
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .eyebrow-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 -6px -2px 0;
  }
  .eyebrow{
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink-3);
    line-height: 1.3;
  }
  .eyebrow .sep{ opacity: .5; margin: 0 4px; }

  .icon-btn{
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .15s, color .15s, transform .1s;
  }
  .icon-btn:hover{ background: var(--hover); color: var(--ink); }
  .icon-btn:active{ transform: scale(.92); }
  .icon-btn.on{ background: var(--copper-soft); color: var(--copper); }
  .icon-group{ display: flex; gap: 0; }

  .top-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .title{
    margin: 0;
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1.05;
    color: var(--ink);
    white-space: nowrap;
  }
  .title-accent{
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 34px;
    letter-spacing: -.015em;
    color: var(--copper);
    margin-left: 2px;
  }
  .counter{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.005em;
    white-space: nowrap;
  }

  .progress-mini{
    width: 100%;
    height: 3px;
    border-radius: 99px;
    background: var(--track);
    overflow: hidden;
    transition: opacity .2s ease;
  }
  .progress-fill{
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--copper-light) 0%, var(--copper) 100%);
    border-radius: 99px;
    transition: width .5s cubic-bezier(.32,.72,0,1), background .3s;
  }
  .progress-fill.complete{
    background: linear-gradient(90deg, var(--forest) 0%, var(--forest-2) 100%);
  }

  /* ═══════════════ tabs ═══════════════ */
  .mode-tabs{
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 11px;
    background: var(--seg);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
  }
  .mode-tab{
    position: relative;
    flex: 1;
    min-width: 0;
    height: 34px;
    padding: 0 4px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -.005em;
    color: var(--ink-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .mode-tab:hover{ color: var(--ink); }
  .mode-tab.active{
    background: var(--surface);
    color: var(--ink);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.08),
      0 0 0 0.5px rgba(0, 0, 0, 0.03);
  }
  .mode-tab svg{ opacity: .55; color: var(--ink-2); flex-shrink: 0; }
  .mode-tab.active svg{ opacity: 1; color: var(--copper); }
  .badge{
    position: absolute;
    top: 1px;
    right: 1px;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: 99px;
    background: var(--copper);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1;
    display: grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
  }
  .badge:empty{ display: none; }

  @media (max-width: 359px){
    .mode-tab svg{ display: none; }
  }

  /* ═══════════════ pesquisa ═══════════════ */
  .searchbar{
    display: none;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 6px 0 12px;
    border-radius: 12px;
    background: var(--seg);
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .searchbar.open{ display: flex; animation: noteIn .25s ease both; }
  .searchbar input{
    flex: 1;
    min-width: 0;
    height: 40px;
    border: 0;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  .searchbar input::placeholder{ color: var(--ink-3); }
  .searchbar input::-webkit-search-cancel-button{ display: none; }

  /* ═══════════════ content ═══════════════ */
  .content{
    position: relative;
    flex: 1;
    min-height: 0;
  }
  .view{
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .22s ease, visibility 0s linear .22s;
  }
  .view.active{
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .22s ease, visibility 0s;
  }

  .scroll{
    margin: 0;
    padding: 2px 2px 24px 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(128, 128, 128, .3) transparent;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
  }
  .scroll::-webkit-scrollbar{ width: 6px; }
  .scroll::-webkit-scrollbar-thumb{
    background: rgba(128, 128, 128, .3);
    border-radius: 99px;
  }
  .scroll::-webkit-scrollbar-track{ background: transparent; }

  .notes-list{
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ═══════════════ tarefas · cards estilo Keep ═══════════════ */
  .keep-grid{
    list-style: none;
    margin: 0;
    padding: 0;
    column-count: 2;
    column-gap: 10px;
  }

  .kcard{
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin: 0 0 10px;
    padding: 14px 12px 8px 14px;
    border-radius: 16px;
    background: var(--t0);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-item);
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    animation: noteIn .35s cubic-bezier(.22,1,.36,1) both;
    transition: background .2s, border-color .18s, box-shadow .18s, opacity .2s;
  }
  .kcard.t0{ background: var(--t0); }
  .kcard.t1{ background: var(--t1); }
  .kcard.t2{ background: var(--t2); }
  .kcard.t3{ background: var(--t3); }
  .kcard.t4{ background: var(--t4); }
  .kcard.no-anim{ animation: none; }
  .kcard:hover{ border-color: var(--card-border-strong); }
  .kcard.important{ border-left: 3px solid var(--copper); padding-left: 12px; }
  .kcard-text{
    margin: 0;
    min-height: 36px;
    font-size: 15.5px;
    line-height: 1.38;
    font-weight: 600;
    letter-spacing: -.012em;
    color: var(--ink);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    cursor: pointer;
  }
  .kcard-foot{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-left: -4px;
    margin-right: -6px;
  }
  .kcard-tools{ display: flex; }
  .kcard .note-action{ width: 28px; height: 28px; }
  .kcard.important .note-action[data-action="star-task"]{ opacity: 1; color: var(--copper); }
  .kcard.done{
    background: var(--surface-2);
    box-shadow: none;
  }
  .kcard.done .kcard-text{
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    text-decoration-color: rgba(163, 163, 163, .8);
    color: var(--ink-3);
    font-weight: 500;
  }
  .kcard.removing{
    animation: noteOut .22s ease forwards;
    pointer-events: none;
  }
  .kcard.done .shop-check{
    background: var(--forest);
    border-color: var(--forest);
    color: #fff;
  }

  .due{
    align-self: flex-start;
    padding: 3px 9px;
    border-radius: 99px;
    background: var(--hover);
    color: var(--ink-2);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: capitalize;
  }
  .due.today{ background: var(--copper-soft); color: var(--copper); }
  .due.overdue{ background: var(--danger-bg); color: var(--danger); }
  .due.soon{ background: var(--forest-soft); color: var(--ink-2); }

  .allclear{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 12px;
    padding: 14px;
    border-radius: 14px;
    background: var(--forest-soft);
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 700;
    animation: noteIn .4s ease both;
  }
  .allclear svg{ color: var(--forest); }

  /* ═══════════════ notas ═══════════════ */
  .note{
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 13px 10px 13px 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: var(--shadow-item);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    animation: noteIn .35s cubic-bezier(.22,1,.36,1) both;
    transition: border-color .18s, box-shadow .18s;
  }
  .note:hover{ border-color: var(--card-border-strong); }
  .note.pinned{
    border-color: rgba(180, 83, 9, .28);
    background: var(--pin-bg);
  }

  @keyframes noteIn{
    from{ opacity: 0; transform: translateY(-6px) scale(.99); }
    to  { opacity: 1; transform: none; }
  }
  .note.removing{
    animation: noteOut .22s ease forwards;
    pointer-events: none;
  }
  @keyframes noteOut{
    to{ opacity: 0; transform: translateX(-14px) scale(.96); }
  }

  .note-accent{
    width: 4px;
    border-radius: 2px;
    background: var(--note-color, var(--copper));
    flex-shrink: 0;
    min-height: 22px;
  }
  .note.pinned .note-accent{
    background: linear-gradient(180deg, var(--copper-light) 0%, var(--copper) 100%);
    width: 5px;
  }

  .note-body{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    justify-content: center;
  }
  .note-text{
    margin: 0;
    padding: 0;
    font-size: 15px;
    line-height: 1.42;
    font-weight: 500;
    letter-spacing: -.005em;
    color: var(--ink);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .note-meta{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .note-pin-tag{
    color: var(--copper);
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .tag{
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--copper-soft);
    color: var(--copper);
    font-weight: 700;
  }
  .price{
    color: var(--ink-2);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }

  .note-actions{
    display: flex;
    align-items: flex-start;
    gap: 0;
    flex-shrink: 0;
    align-self: center;
  }
  .note-action{
    width: 30px;
    height: 30px;
    border: 0;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    opacity: .75;
    transition: opacity .15s, color .15s, background .15s, transform .1s;
  }
  .note-action:hover{ opacity: 1; color: var(--ink-2); background: var(--hover); }
  .note-action:active{ transform: scale(.9); }
  .note-action[data-action="pin"]:hover,
  .note-action[data-action="star-task"]:hover{ color: var(--copper); background: var(--copper-soft); }
  .note-action[data-action="delete-note"]:hover,
  .note-action[data-action="delete-item"]:hover,
  .note-action[data-action="delete-task"]:hover{ color: var(--danger); background: var(--danger-bg); }
  .note.pinned .note-action[data-action="pin"]{
    opacity: 1;
    color: var(--copper);
  }

  /* ─── compras / prendas (checklist) ─── */
  .shop-item{
    align-items: center;
    padding: 10px 8px 10px 12px;
  }
  .shop-item.no-anim{ animation: none; }
  .shop-check{
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border: 1.8px solid var(--ink-4);
    border-radius: 50%;
    background: var(--surface);
    color: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    transition: background .2s, border-color .2s, color .2s, transform .12s;
  }
  .shop-check:hover{ border-color: var(--copper); }
  .shop-check:active{ transform: scale(.9); }
  .shop-item.bought .shop-check{
    background: var(--forest);
    border-color: var(--forest);
    color: #fff;
  }
  .shop-item .note-body{ cursor: pointer; }
  .shop-item.bought{
    background: var(--surface-2);
    box-shadow: none;
  }
  .shop-item.bought .note-text{
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    text-decoration-color: rgba(163, 163, 163, .8);
    color: var(--ink-3);
  }
  .shop-sep{
    list-style: none;
    margin: 8px 2px 2px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .shop-sep:first-child{ margin-top: 2px; }
  div.shop-sep{ margin: 6px 2px 10px; }
  .shop-clear{
    border: 0;
    background: transparent;
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--copper);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background .15s;
  }
  .shop-clear:hover{ background: var(--copper-soft); }

  .summary{
    list-style: none;
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-item);
  }
  .summary div{ flex: 1; }
  .summary small{
    display: block;
    margin-bottom: 2px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .summary strong{
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .summary .accent strong{ color: var(--copper); }

  .notes-empty{
    padding: 60px 20px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--ink-3);
    animation: fadeIn .4s ease both;
    list-style: none;
  }
  @keyframes fadeIn{ from{opacity: 0} to{opacity: 1} }
  .notes-empty .empty-icon{ color: var(--copper); opacity: .4; margin-bottom: 4px; }
  .notes-empty .empty-title{
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.015em;
    color: var(--ink-2);
  }
  .notes-empty .empty-sub{
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-3);
    font-weight: 500;
    line-height: 1.55;
  }

  /* ═══════════════ chips rápidas ═══════════════ */
  .chips{
    display: none;
    gap: 6px;
    flex-shrink: 0;
    overflow-x: auto;
    margin: -2px -20px -2px;
    padding: 2px 20px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0;
    height: 32px;
    padding: 0 13px;
    border-radius: 99px;
    border: 1px solid var(--card-border-strong);
    background: var(--card);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.005em;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .chip:active{ transform: scale(.95); }
  .chip.on{
    background: var(--copper);
    border-color: var(--copper);
    color: #fff;
  }

  /* ═══════════════ form ═══════════════ */
  .add{
    display: flex;
    gap: 6px;
    padding: 4px 4px 4px 18px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, .03),
      0 6px 18px -6px rgba(0, 0, 0, .05),
      inset 0 1px 0 var(--inset-hi);
    transition: border-color .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  .add:focus-within{
    border-color: rgba(180, 83, 9, .4);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, .03),
      0 6px 18px -6px rgba(0, 0, 0, .05),
      0 0 0 4px var(--copper-soft),
      inset 0 1px 0 var(--inset-hi);
  }
  .add input{
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -.005em;
    color: var(--ink);
  }
  .add input::placeholder{ color: var(--ink-3); font-weight: 500; }
  .add button{
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: 0;
    border-radius: 12px;
    background: var(--copper);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow:
      0 1px 2px rgba(146, 64, 14, .28),
      0 4px 12px -4px rgba(146, 64, 14, .35);
    transition: background .2s, transform .1s;
  }
  .add button:hover{ background: var(--copper-2); }
  .add button:active{ transform: scale(.95); }

  /* ═══════════════ empty state (tarefas) ═══════════════ */
  .empty-state{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px;
    border-radius: 24px;
    background: var(--empty-bg);
    border: 2px dashed rgba(180, 83, 9, .26);
    color: var(--ink-3);
    text-align: center;
    animation: fadeIn .4s ease both;
  }
  .empty-state .empty-icon{ color: var(--copper); opacity: .4; margin-bottom: 4px; }
  .empty-state .empty-title{
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-2);
    letter-spacing: -.015em;
  }
  .empty-state .empty-sub{
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-3);
    font-weight: 500;
    line-height: 1.55;
  }
  .empty-btn{
    margin-top: 6px;
    padding: 11px 20px;
    border: 0;
    border-radius: 12px;
    background: var(--copper);
    color: #fff;
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.005em;
    cursor: pointer;
    box-shadow:
      0 1px 2px rgba(146, 64, 14, .28),
      0 4px 12px -4px rgba(146, 64, 14, .35);
    transition: background .2s, transform .1s;
  }
  .empty-btn:hover{ background: var(--copper-2); }
  .empty-btn:active{ transform: scale(.97); }

  /* ═══════════════ footer ═══════════════ */
  .footer{
    margin: 0;
    padding: 2px 0 0;
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .footer-brand{
    color: var(--ink-2);
    font-weight: 800;
    letter-spacing: .14em;
    margin-left: 4px;
  }

  /* ═══════════════ bottom sheet ═══════════════ */
  .sheet-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, .42);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility 0s linear .25s;
    z-index: 9000;
  }
  .sheet-backdrop.open{
    opacity: 1;
    visibility: visible;
    transition: opacity .25s ease, visibility 0s;
  }
  .sheet{
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(100vw, 400px);
    max-height: 88dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-radius: 26px 26px 0 0;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 -12px 40px -8px rgba(0, 0, 0, .3);
    transform: translate(-50%, 105%);
    visibility: hidden;
    outline: none;
    transition: transform .38s cubic-bezier(.22,1,.36,1), visibility 0s linear .38s;
    z-index: 9001;
  }
  .sheet.open{
    transform: translate(-50%, 0);
    visibility: visible;
    transition: transform .38s cubic-bezier(.22,1,.36,1), visibility 0s;
  }
  .sheet-grab{
    width: 38px;
    height: 4px;
    margin: 0 auto 8px;
    border-radius: 99px;
    background: var(--ink-4);
  }
  .sheet-title{
    margin: 6px 0 16px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.025em;
  }
  .sheet-actions{ display: flex; gap: 8px; margin-top: 8px; }
  .btn{
    flex: 1;
    height: 48px;
    border: 0;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.005em;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  .btn:active{ transform: scale(.98); }
  .btn-ghost{ background: var(--seg); color: var(--ink-2); }
  .btn-primary{ background: var(--copper); color: #fff; }
  .btn-primary:hover{ background: var(--copper-2); }

  .field{ margin-bottom: 14px; }
  .field-label{
    display: block;
    margin: 0 0 6px 2px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .field-input{
    display: block;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--card-border-strong);
    border-radius: 12px;
    background: var(--seg);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -.005em;
    outline: none;
    resize: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-input:focus{
    border-color: rgba(180, 83, 9, .5);
    box-shadow: 0 0 0 3px var(--copper-soft);
  }
  textarea.field-input{ min-height: 88px; line-height: 1.4; }
  .chip-row{ display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .color-row{ display: flex; gap: 10px; }
  .dot{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--c);
    box-shadow: inset 0 0 0 2.5px var(--surface);
    cursor: pointer;
    padding: 0;
    transition: transform .1s, border-color .15s;
  }
  .dot:active{ transform: scale(.9); }
  .dot.on{ border-color: var(--ink); }

  .row-btn{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    margin-bottom: 8px;
    padding: 13px 14px;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    background: var(--seg);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .row-btn:active{ transform: scale(.99); }
  .row-btn small{
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
  }
  .row-btn.danger{ color: var(--danger); }
  .row-static{ cursor: default; }
  .row-static:active{ transform: none; }

  .seg{
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 11px;
    background: var(--seg);
  }
  .seg-btn{
    flex: 1;
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg-btn.on{
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }
  .switch{
    position: relative;
    width: 46px;
    height: 28px;
    flex-shrink: 0;
    border: 0;
    border-radius: 99px;
    background: var(--ink-4);
    cursor: pointer;
    transition: background .2s;
  }
  .switch::after{
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    transition: transform .2s cubic-bezier(.22,1,.36,1);
  }
  .switch[aria-checked="true"]{ background: var(--forest); }
  .switch[aria-checked="true"]::after{ transform: translateX(18px); }

  /* ═══════════════ toast ═══════════════ */
  .toast{
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 16px));
    left: 50%;
    transform: translateX(-50%) translateY(-80px) scale(.95);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(20, 20, 20, .94);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    color: #fafaf9;
    font: 600 13.5px/1.2 'Manrope', system-ui, sans-serif;
    letter-spacing: -.005em;
    box-shadow:
      0 2px 6px rgba(0, 0, 0, .15),
      0 12px 32px -8px rgba(0, 0, 0, .28);
    z-index: 9999;
    transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .25s;
    max-width: calc(100vw - 40px);
  }
  .toast.show{
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .toast-msg{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast-action{
    border: 0;
    background: transparent;
    color: var(--copper-light);
    font: 700 13.5px/1 'Manrope', system-ui, sans-serif;
    letter-spacing: -.005em;
    cursor: pointer;
    padding: 4px 0;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .toast-action:hover{ opacity: .8; }
  .toast-action:active{ opacity: .6; }

  /* ═══════════════ confetti ═══════════════ */
  .confetti{
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 9998;
  }
  .confetti span{
    position: absolute;
    top: -14px;
    left: var(--x);
    width: 8px;
    height: 13px;
    border-radius: 2px;
    animation: fall var(--d) var(--del) cubic-bezier(.25,.6,.4,1) both;
  }
  @keyframes fall{
    0%  { opacity: 1; transform: translate(0, 0) rotate(0deg); }
    85% { opacity: 1; }
    100%{ opacity: 0; transform: translate(var(--dx), 105vh) rotate(var(--r)); }
  }

  :focus-visible{
    outline: 2px solid var(--copper);
    outline-offset: 2px;
    border-radius: 6px;
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .note,
    .add,
    .summary{ background: var(--surface); }
  }

  @media (prefers-reduced-motion: reduce){
    .kcard,
    .note,
    .toast,
    .sheet,
    .sheet-backdrop,
    .progress-fill{
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<main class="app">

  <header class="top">
    <div class="eyebrow-row">
      <p class="eyebrow" id="eyebrow"></p>
      <div class="icon-group">
        <button type="button" class="icon-btn" id="searchBtn" aria-label="Pesquisar" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Definições">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 4.5h4.6M10.9 4.5h2.6M2.5 8h2.2M8.3 8h5.2M2.5 11.5h5.4M11.7 11.5h1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="9" cy="4.5" r="1.7" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="6.5" cy="8" r="1.7" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="9.8" cy="11.5" r="1.7" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="top-row">
      <h1 class="title">Não <span class="title-accent">Esquecer</span></h1>
      <div class="counter" id="counter">0 / 0</div>
    </div>
    <div class="progress-mini" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <nav class="mode-tabs" id="modeTabs" aria-label="Modo">
      <button type="button" class="mode-tab active" data-mode="tasks" aria-pressed="true">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3" y="4" width="10" height="1.8" rx=".9" fill="currentColor"/>
          <rect x="3" y="7.1" width="8" height="1.8" rx=".9" fill="currentColor" opacity=".65"/>
          <rect x="3" y="10.2" width="6" height="1.8" rx=".9" fill="currentColor" opacity=".4"/>
        </svg>
        <span>Tarefas</span>
        <span class="badge" data-badge="tasks"></span>
      </button>
      <button type="button" class="mode-tab" data-mode="notes" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 3.5h9v6l-3 3h-6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M9.5 12.5v-3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <span>Notas</span>
      </button>
      <button type="button" class="mode-tab" data-mode="shop" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1.8 2.5h2l1.4 7.2h7l1.2-5H4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.2" cy="12.6" r="1" fill="currentColor"/>
          <circle cx="11.4" cy="12.6" r="1" fill="currentColor"/>
        </svg>
        <span>Compras</span>
        <span class="badge" data-badge="shop"></span>
      </button>
      <button type="button" class="mode-tab" data-mode="gifts" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.5" y="5.5" width="11" height="2.6" rx=".7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M3.5 8.1v5a.7.7 0 00.7.7h7.6a.7.7 0 00.7-.7v-5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M8 5.5v8.3" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 5.5C6.2 5.5 5 4.6 5.5 3.7 6.4 2.7 8 4.1 8 5.5zM8 5.5c1.8 0 3-.9 2.5-1.8C9.6 2.7 8 4.1 8 5.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span>Prendas</span>
        <span class="badge" data-badge="gifts"></span>
      </button>
    </nav>
    <div class="searchbar" id="searchBar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Pesquisar…" autocomplete="off" aria-label="Pesquisar">
      <button type="button" class="icon-btn" id="searchClose" aria-label="Fechar pesquisa">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M3.5 3.5l7 7M10.5 3.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="content">
    <div class="view scroll active" id="taskView"></div>
    <ul class="view scroll notes-list" id="notesList"></ul>
    <ul class="view scroll notes-list" id="shopList"></ul>
    <ul class="view scroll notes-list" id="giftList"></ul>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Atalhos rápidos"></div>

  <form class="add" id="addForm" autocomplete="off">
    <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Nova entrada</label>
    <input id="input" type="text" placeholder="O que não queres esquecer?" maxlength="180" enterkeyhint="done">
    <button type="submit" id="addBtn" aria-label="Adicionar">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M9 3v12M3 9h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </form>

  <p class="footer">Design by <span class="footer-brand">COELHO DIGITAL</span></p>

</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet-grab"></div>
  <h2 class="sheet-title" id="sheetTitle">Editar</h2>
  <div id="sheetBody"></div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-ghost" id="sheetCancel">Cancelar</button>
    <button type="button" class="btn btn-primary" id="sheetSave">Guardar</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-msg" id="toastMsg"></span>
  <button type="button" class="toast-action" id="toastAction">Desfazer</button>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'nao-esquecer-v3';
  var NOTE_COLORS = ['#b45309', '#4a5240', '#a16207', '#c2410c', '#7c2d12'];
  var MODES = ['tasks', 'notes', 'shop', 'gifts'];
  var DEFAULT_SUG = []; /* sem sugestões pré-feitas: só aparecem as que tu fores usando */

  var state = {

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function ymd(offset) {
    var d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseYmd(str) {
    var p = String(str).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function dayDiff(str) {
    var a = parseYmd(str);
    var now = new Date();
    var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((a - b) / 86400000);
  }

  function dueInfo(str, done) {
    if (!str) return null;
    var date = parseYmd(str);
    if (isNaN(date.getTime())) return null;
    var d = dayDiff(str);
    var short = date.toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }).replace('.', '');
    if (done) return { label: short, cls: '' };
    if (d < 0) return { label: 'Atrasada · ' + short, cls: 'overdue' };
    if (d === 0) return { label: 'Hoje', cls: 'today' };
    if (d === 1) return { label: 'Amanhã', cls: 'soon' };
    if (d < 7) return { label: date.toLocaleDateString('pt-PT', { weekday: 'short' }).replace('.', ''), cls: '' };
    return { label: short, cls: '' };
  }

  function fmtWhen(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
      new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (diff === 0) return 'Hoje, ' + t;
    if (diff === 1) return 'Ontem, ' + t;
    return d.toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }).replace('.', '');
  }

  function fmtEur(n) {
    try {
      return n.toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
    } catch (e) {
      return n.toFixed(2) + ' €';
    }
  }

  function parsePrice(s) {
    s = String(s || '').replace(',', '.').replace(/[^\d.]/g, '');
    if (!s) return null;
    var n = parseFloat(s);
    return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
  }

  /* "Mãe – perfume 25€"  →  { person:'Mãe', text:'perfume', price:25 } */
  function parseGift(raw) {
    var text = raw.trim();
    var price = null;
    var person = '';

    var pm = text.match(/(\d+(?:[.,]\d{1,2})?)\s*(€|euros?|eur)(?![a-zà-ú])/i);
    if (pm) {
      var stripped = (text.slice(0, pm.index) + ' ' + text.slice(pm.index + pm[0].length)).replace(/\s+/g, ' ').trim();
      if (stripped) {
        price = parsePrice(pm[1]);
        text = stripped;
      }
    }

    var nm = text.match(/^([^:–—]{1,30}?)\s*(?:[:–—]|\s-\s)\s*(.+)$/);
    if (nm) {
      person = nm[1].trim();
      text = nm[2].trim();
    }
    return { text: text, person: person, price: price };
  }

  function buzz(p) {
    if (!state.settings.haptics) return;

  function validItem(x) {
    return x && typeof x === 'object' && typeof x.id === 'number' && typeof x.text === 'string';
  }

  function nextId(list, n) {
    var m = 0;
    list.forEach(function (x) { if (x.id > m) m = x.id; });
    return Math.max(m + 1, typeof n === 'number' ? n : 1);
  }

    var colors = ['#b45309', '#f59e0b', '#4a5240', '#fbbf24', '#c2410c'];
    var wrap = el('div', 'confetti');
    for (var i = 0; i < 38; i++) {
      var s = document.createElement('span');
      s.style.setProperty('--x', (Math.random() * 100) + 'vw');
      s.style.setProperty('--dx', ((Math.random() - 0.5) * 180) + 'px');
      s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      s.style.setProperty('--d', (1.4 + Math.random() * 1.3) + 's');
      s.style.setProperty('--del', (Math.random() * 0.3) + 's');
      s.style.background = colors[i % colors.length];
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 3400);
  }

    return list.slice().sort(function (a, b) {

      var ib = b.important ? 1 : 0;
      if (ia !== ib) return ib - ia;
      var da = a.due || '9999-99-99';

      return da < db ? -1 : da > db ? 1 : 0;

  function buildTaskCard(task, animate) {

      (task.important ? ' important' : '') +
      (animate ? '' : ' no-anim'));
    li.dataset.id = String(task.id);

    var text = el('p', 'kcard-text', task.text);
    text.dataset.action = 'toggle-task';
    li.appendChild(text);

    var di = dueInfo(task.due, task.done);
    if (di) li.appendChild(el('span', 'due ' + di.cls, di.label));

    var foot = el('div', 'kcard-foot');

    var check = el('button', 'shop-check');
    check.type = 'button';
    check.dataset.action = 'toggle-task';
    check.setAttribute('aria-label', task.done ? 'Marcar como por fazer' : 'Marcar como concluída');
    check.innerHTML = CHECK_SVG;

    var tools = el('div', 'kcard-tools');
    tools.appendChild(actionBtn('star-task', task.important ? 'Remover importante' : 'Marcar importante',

    tools.appendChild(actionBtn('edit-task', 'Editar tarefa', EDIT_SVG));
    tools.appendChild(actionBtn('delete-task', 'Apagar tarefa', DEL_SVG));

    foot.appendChild(check);
    foot.appendChild(tools);
    li.appendChild(foot);
    return li;
  }

  function renderTasks(animId) {
    taskViewEl.innerHTML = '';

    if (state.tasks.length === 0) {
      var es = el('div', 'empty-state');
      es.innerHTML = '<div class="empty-icon">' + EMPTY_TASK_SVG + '</div>' +
        '<p class="empty-title">Ainda nada aqui</p>' +
        '<p class="empty-sub">Escreve a primeira coisa<br>que não queres esquecer</p>';
      var focusBtn = el('button', 'empty-btn', 'Adicionar tarefa');
      focusBtn.type = 'button';
      focusBtn.addEventListener('click', function () { inputEl.focus(); });
      es.appendChild(focusBtn);
      taskViewEl.appendChild(es);
      return;
    }

    var visible = state.tasks.filter(matchItem);
    if (!visible.length) {
      taskViewEl.appendChild(searchEmpty('div'));
      return;
    }

    var pending = sortPending(visible.filter(function (t) { return !t.done; }));
    var done = visible.filter(function (t) { return t.done; });

    if (!pending.length && done.length && !q()) {
      var banner = el('div', 'allclear');
      banner.innerHTML = CHECK_SVG;
      banner.appendChild(el('span', '', 'Tudo feito. Bom trabalho!'));
      taskViewEl.appendChild(banner);
    }

    if (pending.length) {
      var gridP = el('ul', 'keep-grid');
      pending.forEach(function (t) {
        gridP.appendChild(buildTaskCard(t, t.id === animId));
      });
      taskViewEl.appendChild(gridP);
    }

    if (done.length) {
      var sep = el('div', 'shop-sep');
      sep.appendChild(el('span', '', 'Concluídas · ' + done.length));
      var clr = el('button', 'shop-clear', 'Limpar');
      clr.type = 'button';
      clr.dataset.action = 'clear-done';
      sep.appendChild(clr);
      taskViewEl.appendChild(sep);

      var gridD = el('ul', 'keep-grid');
      done.forEach(function (t) {
        gridD.appendChild(buildTaskCard(t, false));
      });
      taskViewEl.appendChild(gridD);
    }
  }

  function addTask(text) {
    var todo = {
      id: state.taskNext,
      text: text,
      done: false,
      important: quick.important,
      due: quick.due || null
    };
    state.taskNext += 1;
    quick.important = false;
    quick.due = '';
    state.tasks.unshift(todo);
    save();
    refresh(todo.id);
    taskViewEl.scrollTop = 0;
    buzz(12);
  }

  function toggleTask(id) {
    var t = findById(state.tasks, id);
    if (!t) return;
    t.done = !t.done;
    save();
    buzz(10);
    refresh();
    if (t.done && state.tasks.every(function (x) { return x.done; })) {
      celebrate();
      buzz([20, 40, 20]);
    }
  }

  function starTask(id) {
    var t = findById(state.tasks, id);
    if (!t) return;
    t.important = !t.important;
    save();
    buzz(8);
    refresh();
  }

  function removeTask(id, elNode) {
    var t = findById(state.tasks, id);
    if (!t) return;

    var deletedIndex = state.tasks.indexOf(t);
    if (elNode) elNode.classList.add('removing');
    state.tasks.splice(deletedIndex, 1);
    save();
    buzz(14);

    setTimeout(function () { refresh(); }, 220);

    showToast('Tarefa apagada', 'Desfazer', function () {
      state.tasks.splice(Math.min(deletedIndex, state.tasks.length), 0, t);
      save();
      refresh();
    });
  }

  function clearDoneTasks() {
    var removed = state.tasks.filter(function (t) { return t.done; });
    if (!removed.length) return;
    var snapshot = state.tasks.slice();

    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    save();
    refresh();

    showToast(removed.length === 1 ? '1 tarefa removida' : removed.length + ' tarefas removidas', 'Desfazer', function () {
      state.tasks = snapshot;
      save();
      refresh();
    });
  }

  function editTask(id) {
    var t = findById(state.tasks, id);
    if (!t) return;
    var draft = { important: !!t.important };

    openSheet({
      title: 'Editar tarefa',
      build: function (b) {
        var ta = makeTextarea(t.text, 180);
        b.appendChild(field('Tarefa', ta));

        var starRow = el('div', 'chip-row');
        var starChip = makeChip('★ Importante', draft.important, function () {
          draft.important = !draft.important;
          starChip.classList.toggle('on', draft.important);
        });
        starRow.appendChild(starChip);
        b.appendChild(field('Prioridade', starRow));

        var dateIn = makeInput(t.due || '', 'date');
        var dueChips = [];
        var dueRow = el('div', 'chip-row');
        function syncDue() {
          dueChips.forEach(function (c) { c.el.classList.toggle('on', c.val === dateIn.value); });
        }
        [['Sem prazo', ''], ['Hoje', ymd(0)], ['Amanhã', ymd(1)]].forEach(function (o) {
          var c = makeChip(o[0], false, function () { dateIn.value = o[1]; syncDue(); });
          dueChips.push({ el: c, val: o[1] });
          dueRow.appendChild(c);
        });
        dateIn.addEventListener('input', syncDue);
        syncDue();
        var dueWrap = el('div', '');
        dueWrap.appendChild(dueRow);
        dueWrap.appendChild(dateIn);
        b.appendChild(field('Prazo', dueWrap));
      },
      onSave: function () {
        var ta = sheetBody.querySelector('textarea');
        var dateIn = sheetBody.querySelector('input[type="date"]');
        var val = ta.value.trim();
        if (val) t.text = val;
        t.important = draft.important;
        t.due = dateIn.value || null;
        save();
        closeSheet();
        refresh();
      }
    });
  }

  /* ═══════════════ notas ═══════════════ */

  function buildNote(note, idx) {
    var li = el('li', 'note' + (note.pinned ? ' pinned' : ''));
    li.dataset.id = String(note.id);
    li.style.setProperty('--note-color', note.color || NOTE_COLORS[idx % NOTE_COLORS.length]);

    var accent = el('span', 'note-accent');

    var body = el('div', 'note-body');
    body.appendChild(el('p', 'note-text', note.text));

    var meta = el('div', 'note-meta');
    if (note.pinned) {
      var tag = el('span', 'note-pin-tag');
      tag.innerHTML = PIN_FILLED_SVG + '<span>Fixada</span>';
      meta.appendChild(tag);
    }
    if (note.createdAt) meta.appendChild(el('span', '', fmtWhen(note.createdAt)));
    if (meta.childNodes.length) body.appendChild(meta);

    var actions = el('div', 'note-actions');
    actions.appendChild(actionBtn('pin', note.pinned ? 'Desafixar nota' : 'Fixar nota',
      note.pinned ? PIN_FILLED_SVG : PIN_SVG));
    actions.appendChild(actionBtn('edit-note', 'Editar nota', EDIT_SVG));
    actions.appendChild(actionBtn('copy', 'Copiar nota', COPY_SVG));
    actions.appendChild(actionBtn('delete-note', 'Apagar nota', DEL_SVG));

    li.appendChild(accent);
    li.appendChild(body);
    li.appendChild(actions);

    return li;
  }

  function sortedNotes() {
    return state.notes.slice().sort(function (a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function renderNotes() {
    notesListEl.innerHTML = '';

    if (state.notes.length === 0) {
      notesListEl.innerHTML =
        '<li class="notes-empty">' +
          '<div class="empty-icon">' + EMPTY_NOTE_SVG + '</div>' +
          '<p class="empty-title">Sem notas</p>' +
          '<p class="empty-sub">Aponta aqui o que não queres esquecer:<br>ideias, senhas, lembretes…</p>' +
        '</li>';
      return;
    }

    var list = sortedNotes().filter(matchItem);
    if (!list.length) {
      notesListEl.appendChild(searchEmpty('li'));
      return;
    }

    list.forEach(function (note, idx) {
      var li = buildNote(note, idx);
      li.style.animationDelay = Math.min(idx * 25, 200) + 'ms';
      notesListEl.appendChild(li);
    });
  }

  function addNote(text) {
    var note = {
      id: state.noteNext,
      text: text,
      color: NOTE_COLORS[(state.noteNext - 1) % NOTE_COLORS.length],
      createdAt: Date.now(),
      pinned: false
    };
    state.noteNext += 1;

    state.notes.unshift(note);
    save();
    refresh();
    notesListEl.scrollTop = 0;
    buzz(12);
  }

  function removeNote(id, elNode) {
    var note = findById(state.notes, id);
    if (!note) return;

    var deletedIndex = state.notes.indexOf(note);
    if (elNode) elNode.classList.add('removing');
    state.notes.splice(deletedIndex, 1);
    save();
    buzz(14);

    setTimeout(function () { refresh(); }, 220);

    showToast('Nota apagada', 'Desfazer', function () {
      state.notes.splice(Math.min(deletedIndex, state.notes.length), 0, note);
      save();
      refresh();
    });
  }

  function togglePinNote(id) {
    var note = findById(state.notes, id);
    if (!note) return;

    note.pinned = !note.pinned;
    save();
    buzz(8);
    refresh();

    showToast(note.pinned ? 'Nota fixada' : 'Nota desafixada', null, null);
  }

  function copyText(text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(okMsg || 'Copiado para a área de transferência', null, null);
      }).catch(function () {
        showToast('Não foi possível copiar', null, null);
      });
    } else {
      showToast('Não foi possível copiar', null, null);
    }
  }

  function copyNote(id) {
    var note = findById(state.notes, id);
    if (note) copyText(note.text);
  }

  function editNote(id) {
    var note = findById(state.notes, id);
    if (!note) return;
    var draft = { color: note.color || NOTE_COLORS[0] };

    openSheet({
      title: 'Editar nota',
      build: function (b) {
        b.appendChild(field('Nota', makeTextarea(note.text, 1000)));

        var row = el('div', 'color-row');
        NOTE_COLORS.forEach(function (c) {
          var d = el('button', 'dot' + (c === draft.color ? ' on' : ''));
          d.type = 'button';
          d.style.setProperty('--c', c);
          d.setAttribute('aria-label', 'Cor ' + c);
          d.addEventListener('click', function () {
            draft.color = c;
            Array.prototype.forEach.call(row.children, function (x) { x.classList.remove('on'); });
            d.classList.add('on');
          });
          row.appendChild(d);
        });
        b.appendChild(field('Cor', row));

      onSave: function () {
        var val = sheetBody.querySelector('textarea').value.trim();
        if (val) note.text = val;
        note.color = draft.color;
        save();
        closeSheet();
        refresh();
      }
    });

  /* ═══════════════ compras + prendas (checklist) ═══════════════ */

  function addHistory(text) {
    var t = text.trim();
    if (!t || t.length > 30) return;
    var key = t.toLowerCase();
    var found = state.history.filter(function (h) { return h.t.toLowerCase() === key; })[0];
    if (found) found.c += 1;
    else state.history.push({ t: t, c: 1 });
    if (state.history.length > 80) {
      state.history.sort(function (a, b) { return b.c - a.c; });
      state.history.length = 60;
    }
  }

  function suggestions() {
    var have = state.shop.filter(function (s) { return !s.bought; })
      .map(function (s) { return s.text.toLowerCase(); });
    var pool = state.history.slice()
      .sort(function (a, b) { return b.c - a.c; })
      .map(function (h) { return h.t; })
      .concat(DEFAULT_SUG);
    var seen = {};
    var out = [];
    pool.forEach(function (t) {
      var k = t.toLowerCase();
      if (seen[k] || have.indexOf(k) !== -1) return;
      seen[k] = 1;
      out.push(t);
    });
    return out.slice(0, 12);
  }

  function personList() {
    var seen = {};
    var out = [];
    state.gifts.forEach(function (g) {
      if (g.person && !seen[g.person]) {
        seen[g.person] = 1;
        out.push(g.person);
      }
    });
    return out.slice(0, 10);
  }

  function buildListItem(kind, item, animate, showPerson) {
    var cfg = LISTS[kind];
    var li = el('li', 'note shop-item' + (item.bought ? ' bought' : '') + (animate ? '' : ' no-anim'));
    li.dataset.id = String(item.id);

    var check = el('button', 'shop-check');
    check.type = 'button';
    check.dataset.action = 'toggle-item';
    check.setAttribute('aria-label', item.bought ? cfg.ariaOff : cfg.ariaOn);
    check.innerHTML = CHECK_SVG;

    var body = el('div', 'note-body');
    body.dataset.action = 'toggle-item';
    body.appendChild(el('p', 'note-text', item.text));

    if (kind === 'gifts') {
      var meta = el('div', 'note-meta');
      if (showPerson && item.person) meta.appendChild(el('span', 'tag', item.person));
      if (typeof item.price === 'number') meta.appendChild(el('span', 'price', fmtEur(item.price)));
      if (meta.childNodes.length) body.appendChild(meta);
    }

    var actions = el('div', 'note-actions');
    actions.appendChild(actionBtn('edit-item', 'Editar', EDIT_SVG));
    actions.appendChild(actionBtn('delete-item', 'Apagar', DEL_SVG));

    li.appendChild(check);
    li.appendChild(body);
    li.appendChild(actions);
    return li;
  }

  function sumPrices(list) {
    return list.reduce(function (acc, g) { return acc + (typeof g.price === 'number' ? g.price : 0); }, 0);
  }

  function renderList(kind, animId) {
    var cfg = LISTS[kind];
    var items = state[kind];
    cfg.el.innerHTML = '';

    if (items.length === 0) {
      cfg.el.innerHTML =
        '<li class="notes-empty">' +
          '<div class="empty-icon">' + cfg.icon + '</div>' +
          '<p class="empty-title">' + cfg.title + '</p>' +
          '<p class="empty-sub">' + cfg.sub + '</p>' +
        '</li>';
      return;
    }

    var visible = items.filter(matchItem);
    if (!visible.length) {
      cfg.el.appendChild(searchEmpty('li'));
      return;
    }

    var pending = visible.filter(function (s) { return !s.bought; });
    var bought = visible.filter(function (s) { return s.bought; });

    if (kind === 'gifts' && !q()) {
      var total = sumPrices(items);
      if (total > 0) {
        var left = sumPrices(items.filter(function (g) { return !g.bought; }));
        var sum = el('li', 'summary');
        var d1 = el('div', 'accent');
        d1.appendChild(el('small', '', 'Por comprar'));
        d1.appendChild(el('strong', '', fmtEur(left)));
        var d2 = el('div', '');
        d2.appendChild(el('small', '', 'Total'));
        d2.appendChild(el('strong', '', fmtEur(total)));
        sum.appendChild(d1);
        sum.appendChild(d2);
        cfg.el.appendChild(sum);
      }
    }

    if (kind === 'gifts') {
      var groups = {};
      var order = [];
      pending.forEach(function (it) {
        var p = it.person || '';
        if (!groups[p]) { groups[p] = []; order.push(p); }
        groups[p].push(it);
      });
      order.sort(function (a, b) {
        if (a === '') return 1;
        if (b === '') return -1;
        return a.localeCompare(b, 'pt');
      });
      var showHeads = !(order.length === 1 && order[0] === '');
      order.forEach(function (p) {
        if (showHeads) {
          var head = el('li', 'shop-sep');
          head.appendChild(el('span', '', p || 'Sem destinatário'));
          var sub = sumPrices(groups[p]);
          if (sub > 0) head.appendChild(el('span', '', fmtEur(sub)));
          cfg.el.appendChild(head);
        }
        groups[p].forEach(function (item) {
          cfg.el.appendChild(buildListItem(kind, item, item.id === animId, false));
        });
      });
    } else {
      pending.forEach(function (item) {
        cfg.el.appendChild(buildListItem(kind, item, item.id === animId, false));
      });
    }

    if (bought.length) {
      var sep = el('li', 'shop-sep');
      sep.appendChild(el('span', '', cfg.doneLabel + ' · ' + bought.length));
      var clr = el('button', 'shop-clear', 'Limpar');
      clr.type = 'button';
      clr.dataset.action = 'clear-bought';
      sep.appendChild(clr);
      cfg.el.appendChild(sep);

      bought.forEach(function (item) {
        cfg.el.appendChild(buildListItem(kind, item, false, true));
      });
    }
  }

  function addListItem(kind, text, extra) {
    var cfg = LISTS[kind];
    var item = { id: state[cfg.next], text: text, bought: false };
    state[cfg.next] += 1;
    if (extra) {
      if (extra.person) item.person = extra.person;
      if (typeof extra.price === 'number') item.price = extra.price;
    }
    if (kind === 'shop') addHistory(text);
    state[kind].push(item);
    save();
    refresh(item.id);
    buzz(12);

    var node = cfg.el.querySelector('[data-id="' + item.id + '"]');
    if (node && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
  }

  function toggleListItem(kind, id) {
    var item = findById(state[kind], id);
    if (!item) return;
    item.bought = !item.bought;
    save();
    buzz(10);
    refresh();
  }

  function removeListItem(kind, id, elNode) {
    var cfg = LISTS[kind];
    var item = findById(state[kind], id);
    if (!item) return;

    var deletedIndex = state[kind].indexOf(item);
    if (elNode) elNode.classList.add('removing');
    state[kind].splice(deletedIndex, 1);
    save();
    buzz(14);

    setTimeout(function () { refresh(); }, 220);

    showToast(cfg.delMsg, 'Desfazer', function () {
      state[kind].splice(Math.min(deletedIndex, state[kind].length), 0, item);
      save();
      refresh();
    });
  }

  function clearBought(kind) {
    var removed = state[kind].filter(function (s) { return s.bought; });
    if (!removed.length) return;
    var snapshot = state[kind].slice();

    state[kind] = state[kind].filter(function (s) { return !s.bought; });
    save();
    refresh();

    showToast(removed.length === 1 ? '1 item removido' : removed.length + ' itens removidos', 'Desfazer', function () {
      state[kind] = snapshot;
      save();
      refresh();
    });
  }

  function editListItem(kind, id) {
    var cfg = LISTS[kind];
    var item = findById(state[kind], id);
    if (!item) return;

    openSheet({
      title: cfg.editTitle,
      build: function (b) {
        b.appendChild(field(kind === 'gifts' ? 'Prenda' : 'Item', makeTextarea(item.text, 180)));
        if (kind === 'gifts') {
          var pIn = makeInput(item.person || '', 'text', 'Ex: Mãe', 30);
          pIn.dataset.role = 'person';
          b.appendChild(field('Para quem', pIn));
          var prIn = makeInput(typeof item.price === 'number' ? String(item.price).replace('.', ',') : '', 'text', '0,00');
          prIn.setAttribute('inputmode', 'decimal');
          prIn.dataset.role = 'price';
          b.appendChild(field('Preço (€)', prIn));
        }
      },
      onSave: function () {
        var val = sheetBody.querySelector('textarea').value.trim();
        if (val) item.text = val;
        if (kind === 'gifts') {
          var person = sheetBody.querySelector('[data-role="person"]').value.trim();
          var price = parsePrice(sheetBody.querySelector('[data-role="price"]').value);
          if (person) item.person = person; else delete item.person;
          if (price != null) item.price = price; else delete item.price;
        }
        save();
        closeSheet();
        refresh();
      }
    });
  }

  /* ═══════════════ chips rápidas ═══════════════ */

  function renderChips() {
    var mode = state.mode;
    var list = [];

    if (searchOpen || mode === 'notes') {
      chipsEl.style.display = 'none';
      return;
    }

    if (mode === 'tasks') {
      list = [
        { k: 'imp', l: '★ Importante', on: quick.important },
        { k: 'today', l: 'Para hoje', on: quick.due === ymd(0) },
        { k: 'tomorrow', l: 'Para amanhã', on: quick.due === ymd(1) }
      ];
    } else if (mode === 'shop') {
      suggestions().forEach(function (t) { list.push({ k: 'sug', l: '+ ' + t, t: t }); });
    } else {
      personList().forEach(function (p) { list.push({ k: 'person', l: p, t: p, on: quick.person === p }); });
    }

    var sl = chipsEl.scrollLeft;
    chipsEl.innerHTML = '';
    if (!list.length) {
      chipsEl.style.display = 'none';
      return;
    }
    list.forEach(function (c) {
      var b = el('button', 'chip' + (c.on ? ' on' : ''), c.l);
      b.type = 'button';
      b.dataset.chip = c.k;
      if (c.t) b.dataset.text = c.t;
      chipsEl.appendChild(b);
    });
    chipsEl.style.display = 'flex';
    chipsEl.scrollLeft = sl;
  }

  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-chip]');
    if (!b) return;
    var k = b.dataset.chip;

    if (k === 'imp') quick.important = !quick.important;
    else if (k === 'today') quick.due = quick.due === ymd(0) ? '' : ymd(0);
    else if (k === 'tomorrow') quick.due = quick.due === ymd(1) ? '' : ymd(1);
    else if (k === 'person') quick.person = quick.person === b.dataset.text ? '' : b.dataset.text;
    else if (k === 'sug') { addListItem('shop', b.dataset.text); return; }

    buzz(6);
    renderChips();
  });

  /* ═══════════════ UI ═══════════════ */

  function setProgress(done, total) {
    progressWrap.style.display = '';
    progressFillEl.classList.toggle('complete', total > 0 && done === total);
    progressFillEl.style.width = (total ? done / total * 100 : 0) + '%';
  }

  function updateUI() {
    if (state.mode === 'tasks') {
      var total = state.tasks.length;
      var done = state.tasks.filter(function (t) { return t.done; }).length;
      counterEl.textContent = done + ' / ' + total + ' feitas';
      setProgress(done, total);
    } else if (state.mode === 'notes') {
      var n = state.notes.length;
      counterEl.textContent = n + (n === 1 ? ' nota' : ' notas');
      progressWrap.style.display = 'none';
    } else {
      var cfg = LISTS[state.mode];
      var items = state[state.mode];
      var got = items.filter(function (s) { return s.bought; }).length;
      counterEl.textContent = got + ' / ' + items.length + ' ' + cfg.unit;
      setProgress(got, items.length);
    }
  }

  function updateBadges() {
    var counts = {
      tasks: state.tasks.filter(function (t) { return !t.done; }).length,
      shop: state.shop.filter(function (s) { return !s.bought; }).length,
      gifts: state.gifts.filter(function (s) { return !s.bought; }).length
    };
    Array.prototype.forEach.call(modeTabs.querySelectorAll('[data-badge]'), function (b) {
      var c = counts[b.dataset.badge] || 0;
      b.textContent = c > 0 ? (c > 99 ? '99+' : String(c)) : '';
    });
  }

  function renderCurrent(animId) {
    if (state.mode === 'tasks') renderTasks(animId);
    else if (state.mode === 'notes') renderNotes();
    else renderList(state.mode, animId);
  }

  function refresh(animId) {
    renderCurrent(animId);
    updateUI();
    updateBadges();
    renderChips();
  }

  function render() {
    setEyebrow();

    Array.prototype.forEach.call(modeTabs.querySelectorAll('.mode-tab'), function (btn) {
      var active = btn.dataset.mode === state.mode;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });

    taskViewEl.classList.toggle('active', state.mode === 'tasks');
    notesListEl.classList.toggle('active', state.mode === 'notes');
    shopListEl.classList.toggle('active', state.mode === 'shop');
    giftListEl.classList.toggle('active', state.mode === 'gifts');

    if (state.mode === 'tasks') inputEl.placeholder = 'O que não queres esquecer?';
    else if (state.mode === 'notes') inputEl.placeholder = 'Apontar algo…';
    else inputEl.placeholder = LISTS[state.mode].placeholder;

    searchInput.placeholder = 'Pesquisar em ' + TITLES[state.mode].toLowerCase() + '…';

    refresh();
  }

  function switchMode(newMode) {
    if (state.mode === newMode) return;
    state.mode = newMode;
    save();
    render();
    /* sem focus: o teclado só abre quando tocas na caixa de texto */
  }

  /* ═══════════════ partilhar / backup / definições ═══════════════ */

  function listAsText() {
    var m = state.mode;
    var lines = [];
    if (m === 'tasks') {
      state.tasks.forEach(function (t) {
        var di = dueInfo(t.due, true);
        lines.push((t.done ? '☑ ' : '☐ ') + (t.important ? '★ ' : '') + t.text + (di ? ' (' + di.label + ')' : ''));
      });
    } else if (m === 'notes') {
      return TITLES.notes + '\n\n' + sortedNotes().map(function (n) { return n.text; }).join('\n\n');
    } else if (m === 'shop') {
      state.shop.forEach(function (s) { lines.push((s.bought ? '☑ ' : '☐ ') + s.text); });
    } else {
      state.gifts.forEach(function (g) {
        lines.push((g.bought ? '☑ ' : '☐ ') + (g.person ? g.person + ' – ' : '') + g.text +
          (typeof g.price === 'number' ? ' (' + fmtEur(g.price) + ')' : ''));
      });
    }
    return TITLES[m] + '\n\n' + lines.join('\n');
  }

  function shareCurrent() {
    var text = listAsText();
    if (navigator.share) {
      navigator.share({ title: TITLES[state.mode], text: text }).catch(function () {});
    } else {
      copyText(text, 'Lista copiada');
    }
  }

  function exportBackup() {
    try {
      var blob = new Blob([JSON.stringify(dataSnapshot(), null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nao-esquecer-backup-' + ymd(0) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 500);
      showToast('Backup exportado', null, null);
    } catch (e) {
      showToast('Não foi possível exportar', null, null);
    }
  }

  function rowBtn(label, sub, handler, cls) {
    var b = el('button', 'row-btn' + (cls ? ' ' + cls : ''));
    b.type = 'button';
    var left = el('span', '');
    left.appendChild(document.createTextNode(label));
    if (sub) left.appendChild(el('small', '', sub));
    b.appendChild(left);
    b.addEventListener('click', handler);
    return b;
  }

  function openSettings() {
    openSheet({
      title: 'Definições',
      build: function (b) {
        /* tema */
        var seg = el('div', 'seg');
        [['auto', 'Auto'], ['light', 'Claro'], ['dark', 'Escuro']].forEach(function (o) {
          var bt = el('button', 'seg-btn' + (state.settings.theme === o[0] ? ' on' : ''), o[1]);
          bt.type = 'button';
          bt.addEventListener('click', function () {
            state.settings.theme = o[0];
            save();
            applyTheme();
            Array.prototype.forEach.call(seg.children, function (c) { c.classList.remove('on'); });
            bt.classList.add('on');
          });
          seg.appendChild(bt);
        });
        b.appendChild(field('Tema', seg));

        /* vibração */
        var hapRow = el('div', 'row-btn row-static');
        var hl = el('span', '');
        hl.appendChild(document.createTextNode('Vibração'));
        hl.appendChild(el('small', '', 'Pequeno toque ao concluir e adicionar'));
        var sw = el('button', 'switch');
        sw.type = 'button';
        sw.setAttribute('role', 'switch');
        sw.setAttribute('aria-label', 'Vibração');
        sw.setAttribute('aria-checked', state.settings.haptics ? 'true' : 'false');
        sw.addEventListener('click', function () {
          state.settings.haptics = !state.settings.haptics;
          sw.setAttribute('aria-checked', state.settings.haptics ? 'true' : 'false');
          save();
          buzz(10);
        });
        hapRow.appendChild(hl);
        hapRow.appendChild(sw);
        b.appendChild(hapRow);

        /* partilhar */
        b.appendChild(rowBtn('Partilhar ' + TITLES[state.mode].toLowerCase(),
          'Envia ou copia a lista atual como texto', function () { closeSheet(); shareCurrent(); }));

        /* backup */
        b.appendChild(rowBtn('Exportar backup', 'Guarda tudo num ficheiro .json', function () { exportBackup(); }));

        var fileIn = document.createElement('input');
        fileIn.type = 'file';
        fileIn.accept = '.json,application/json';
        fileIn.style.display = 'none';
        fileIn.addEventListener('change', function () {
          var f = fileIn.files && fileIn.files[0];
          if (!f) return;
          var r = new FileReader();
          r.onload = function () {
            try {
              var d = JSON.parse(r.result);
              if (!d || typeof d !== 'object') throw new Error('invalid');
              if (!window.confirm('Substituir os dados atuais por este backup?')) return;
              applyData(d);
              save();
              applyTheme();
              closeSheet();
              render();
              showToast('Backup importado', null, null);
            } catch (err) {
              showToast('Ficheiro inválido', null, null);
            }
          };
          r.readAsText(f);
        });
        b.appendChild(fileIn);
        b.appendChild(rowBtn('Importar backup', 'Repõe os dados de um ficheiro .json', function () { fileIn.click(); }));

        /* apagar tudo (2 toques) */
        var armed = false;
        var armTimer = null;
        var wipe = rowBtn('Apagar tudo', 'Tarefas, notas, compras e prendas', function () {
          if (!armed) {
            armed = true;
            wipe.firstChild.firstChild.nodeValue = 'Toca outra vez para confirmar';
            armTimer = setTimeout(function () {
              armed = false;
              wipe.firstChild.firstChild.nodeValue = 'Apagar tudo';
            }, 4000);
            return;
          }
          clearTimeout(armTimer);
          state.tasks = []; state.notes = []; state.shop = []; state.gifts = []; state.history = [];
          state.taskNext = 1; state.noteNext = 1; state.shopNext = 1; state.giftNext = 1;
          save();
          closeSheet();
          render();
          showToast('Tudo apagado', null, null);
        }, 'danger');
        b.appendChild(wipe);
      }
    });
  }

  settingsBtn.addEventListener('click', openSettings);

  /* ═══════════════ add ═══════════════ */

  function handleAdd() {
    var text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }

    if (searchOpen) toggleSearch(false);

    if (state.mode === 'tasks') {
      addTask(text);
    } else if (state.mode === 'notes') {
      addNote(text);
    } else if (state.mode === 'gifts') {
      var g = parseGift(text);
      if (!g.person && quick.person) g.person = quick.person;
      addListItem('gifts', g.text, { person: g.person, price: g.price });
    } else {
      addListItem('shop', text);
    }

    inputEl.value = '';
    inputEl.blur(); /* fecha o teclado para veres a lista */
  }

  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    handleAdd();
  });

  addBtn.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    e.preventDefault();
    handleAdd();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleAdd();
    }
  });

  /* ═══════════════ eventos ═══════════════ */

  modeTabs.addEventListener('click', function (e) {
    var btn = e.target.closest('.mode-tab');
    if (!btn) return;
    switchMode(btn.dataset.mode);
  });

  taskViewEl.addEventListener('click', function (e) {
    var target = e.target.closest('[data-action]');
    if (!target) return;
    var action = target.dataset.action;

    if (action === 'clear-done') { clearDoneTasks(); return; }

    var cardEl = target.closest('.kcard');
    if (!cardEl) return;
    var id = Number(cardEl.dataset.id);

    if (action === 'toggle-task') toggleTask(id);
    else if (action === 'star-task') starTask(id);
    else if (action === 'edit-task') editTask(id);
    else if (action === 'delete-task') removeTask(id, cardEl);
  });

  notesListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var noteEl = btn.closest('.note');
    if (!noteEl) return;
    var id = Number(noteEl.dataset.id);

    if (btn.dataset.action === 'pin') togglePinNote(id);
    else if (btn.dataset.action === 'edit-note') editNote(id);
    else if (btn.dataset.action === 'copy') copyNote(id);
    else if (btn.dataset.action === 'delete-note') removeNote(id, noteEl);
  });

  function bindList(kind) {
    LISTS[kind].el.addEventListener('click', function (e) {
      var target = e.target.closest('[data-action]');
      if (!target) return;
      var action = target.dataset.action;

      if (action === 'clear-bought') { clearBought(kind); return; }

      var itemEl = target.closest('.shop-item');
      if (!itemEl) return;
      var id = Number(itemEl.dataset.id);

      if (action === 'toggle-item') toggleListItem(kind, id);
      else if (action === 'edit-item') editListItem(kind, id);
      else if (action === 'delete-item') removeListItem(kind, id, itemEl);
    });
  }
  bindList('shop');
  bindList('gifts');

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (sheetOpen) { closeSheet(); return; }
      if (searchOpen) { toggleSearch(false); return; }
      if (toast.classList.contains('show')) hideToast();
      return;
    }

    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    if (sheetOpen) return;

    if ((e.metaKey || e.ctrlKey) && e.key === '1') { e.preventDefault(); switchMode('tasks'); }
    else if ((e.metaKey || e.ctrlKey) && e.key === '2') { e.preventDefault(); switchMode('notes'); }
    else if ((e.metaKey || e.ctrlKey) && e.key === '3') { e.preventDefault(); switchMode('shop'); }
    else if ((e.metaKey || e.ctrlKey) && e.key === '4') { e.preventDefault(); switchMode('gifts'); }
    else if (e.key === '/') { e.preventDefault(); toggleSearch(true); }
  });

  /* ao voltar à app (novo dia, prazos, tema) */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !sheetOpen) {
      setEyebrow();
      refresh();
    }
  });

  /* arranque */
  render();
})();
</script>
</body>
</html>
